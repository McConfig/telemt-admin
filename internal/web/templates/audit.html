{{define "audit.html"}}<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудит · TeleMT Admin</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body><main>
<h1>Аудит</h1>
<p><a href="/">← к пользователям</a></p>
<table>
<thead><tr><th>Время</th><th>Кто</th><th>Действие</th><th>Цель</th><th>Результат</th><th>IP</th></tr></thead>
<tbody>
{{range .Events}}
<tr><td>{{fmtTime .At}}</td><td>{{.Actor}}</td><td>{{.Action}}</td><td>{{.Target}}</td><td>{{.Result}}</td><td>{{.IP}}</td></tr>
{{else}}<tr><td colspan="6">Событий нет</td></tr>{{end}}
</tbody></table>
</main></body></html>{{end}}
