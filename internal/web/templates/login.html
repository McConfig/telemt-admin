{{define "login.html"}}<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · TeleMT Admin</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body><main>
<h1>Вход в TeleMT Admin</h1>
{{if .NoUsers}}
<p class="error">Пользователей ещё нет. Создайте администратора в контейнере:</p>
<pre>docker compose run --rm tgadmin user add admin --role admin</pre>
{{else}}
<form method="post" action="/login">
  <p><label>Имя<br><input name="username" autocomplete="username" required></label></p>
  <p><label>Пароль<br><input name="password" type="password" autocomplete="current-password" required></label></p>
  <p><button type="submit">Войти</button></p>
</form>
{{end}}
</main></body></html>{{end}}
