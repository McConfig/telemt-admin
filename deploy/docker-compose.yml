name: telemt-admin

services:
  tgadmin:
    image: ghcr.io/example/telemt-admin:0.1.0
    restart: unless-stopped
    env_file: .env
    depends_on: [valkey]
    ports: ["8090:8090"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${VALKEY_PASSWORD}"]
    volumes: ["valkey_data:/data"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

volumes:
  valkey_data: {}
