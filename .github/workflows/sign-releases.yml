name: sign-releases

# Подписывает уже опубликованные релизы, у которых нет артефактов подписи.
# Нужен для OpenSSF Scorecard Signed-Releases: проверяются последние 5 релизов.
#
# Запуск вручную:
#   gh workflow run sign-releases.yml -f "tags=v1.1.4 v1.1.5 v1.1.6 v1.1.7"
#
# Для каждого тега workflow:
#   1. находит digest опубликованного multi-arch образа;
#   2. подписывает digest ключом cosign без хранения ключа (keyless OIDC);
#   3. собирает SBOM через syft и подписывает его;
#   4. прикладывает SBOM, .sig и .pem к существующему GitHub Release;
#   5. создаёт SPDX-аттестацию в реестре.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Теги через пробел"
        required: true
        default: "v1.1.4 v1.1.5 v1.1.6 v1.1.7"

permissions: {}

jobs:
  sign:
    name: Подписать релизы
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - name: Установить cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1

      - name: Установить syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Подписать образы и SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"

          for tag in $TAGS; do
            echo "::group::${tag}"

            image="${image_base}:${tag}"
            digest=$(docker buildx imagetools inspect "$image" \
              --format '{{.Manifest.Digest}}')
            if [ -z "$digest" ]; then
              echo "Не удалось получить digest для ${image}" >&2
              exit 1
            fi
            echo "Образ: ${image}@${digest}"

            cosign sign --yes "${image}@${digest}"

            sbom="sbom-${tag}.spdx.json"
            syft "${image}@${digest}" \
              --platform linux/amd64 \
              -o spdx-json > "$sbom"

            cosign sign-blob --yes \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.pem" \
              "$sbom"

            cosign attest --yes \
              --predicate "$sbom" \
              --type spdxjson \
              "${image}@${digest}"

            gh release upload "$tag" \
              "$sbom" "${sbom}.sig" "${sbom}.pem" \
              --clobber

            echo "::endgroup::"
          done

      - name: Итог
        if: always()
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          {
            echo "## Подпись релизов"
            echo
            echo "Теги: \`${TAGS}\`"
            echo
            echo "Для каждого тега: cosign-подпись образа, SBOM, подпись SBOM,"
            echo "SPDX-аттестация и загрузка файлов в GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
