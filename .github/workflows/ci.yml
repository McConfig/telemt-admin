name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test -coverprofile=coverage.out ./...
      - name: Проверить покрытие не ниже 80%
        run: |
          total=$(awk 'NR > 1 { stmts += $2; if ($3 > 0) covered += $2 } END { printf "%.1f", 100 * covered / stmts }' coverage.out)
          echo "покрытие: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 80.0) { print "покрытие ниже 80%"; exit 1 } }'
      - name: Проверить покрытие API не ниже 85%
        run: |
          go test -coverprofile=web-coverage.out ./internal/web
          total=$(go tool cover -func=web-coverage.out | awk '/total:/ {gsub("%","",$3); print $3}')
          echo "покрытие API: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 85.0) { print "покрытие API ниже 85%"; exit 1 } }'
      - run: go vet ./...
      - name: Проверить демо-стек
        run: |
          go vet -tags demo ./deploy/demo/... ./hack/gen-demo-geoip
          go test -tags demo ./deploy/demo/... ./hack/gen-demo-geoip
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...
      - run: ./hack/check-anonymized.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: coverage
          path: coverage.out
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 1

  coverage-badge:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend
      - name: Опубликовать coverage.json в ветку badges
        run: |
          total=$(awk 'NR > 1 { stmts += $2; if ($3 > 0) covered += $2 } END { printf "%.1f", 100 * covered / stmts }' coverage.out)
          color=red
          awk -v t="$total" 'BEGIN { if (t >= 80) exit 0; exit 1 }' && color=brightgreen
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$total" "$color" > coverage.json
          frontend=$(python3 -c "import json; print('%.1f' % json.load(open('frontend/coverage-summary.json'))['total']['lines']['pct'])")
          fcolor=red
          awk -v t="$frontend" 'BEGIN { if (t >= 60) exit 0; exit 1 }' && fcolor=brightgreen
          printf '{"schemaVersion":1,"label":"frontend coverage","message":"%s%%","color":"%s"}\n' "$frontend" "$fcolor" > frontend-coverage.json
          mv coverage.out /tmp/coverage.out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan badges
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/coverage.out .
          git add coverage.json frontend-coverage.json
          git commit -q -m "coverage: ${total}% backend, ${frontend}% frontend"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:badges

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: securego/gosec@244f1f6f4d1d0d14f89e79a73dab1219eabb5228 # master
        with:
          args: ./...
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
