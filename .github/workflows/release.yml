name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: >-
            type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Сохранить digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/digest-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Собрать manifest из двух архитектур
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.name }}:${{ github.ref_name }}" \
            "${{ steps.image.outputs.name }}@$(cat digests/digest-amd64.txt)" \
            "${{ steps.image.outputs.name }}@$(cat digests/digest-arm64.txt)"
      - id: digest
        run: |
          digest=$(docker buildx imagetools inspect \
            "${{ steps.image.outputs.name }}:${{ github.ref_name }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "value=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Подписать образ
        run: |
          cosign sign --yes \
            "${{ steps.image.outputs.name }}@${{ steps.digest.outputs.value }}"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          artifact-name: sbom.spdx.json

  release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom.spdx.json
          path: .
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          body: |
            Образ: `ghcr.io/mcconfig/telemt-admin:${{ github.ref_name }}` (linux/amd64, linux/arm64).

            Проверка подписи:

            ```bash
            cosign verify ghcr.io/mcconfig/telemt-admin:${{ github.ref_name }} \
              --certificate-identity-regexp 'https://github.com/McConfig/telemt-admin/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Проверка provenance:

            ```bash
            gh attestation verify oci://ghcr.io/mcconfig/telemt-admin:${{ github.ref_name }} --owner McConfig
            ```

            SBOM приложен к релизу файлом `sbom.spdx.json`.
          files: sbom.spdx.json
